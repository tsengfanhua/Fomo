name: FomoThon CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fomothon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install optional protocol/model test SDKs
        working-directory: fomothon
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run deterministic verification
        working-directory: fomothon
        run: npm run verify

      - name: Check JavaScript and Python syntax
        working-directory: fomothon
        run: |
          find src public eval scripts -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m py_compile e2e/e2e_flow.py

      - name: Run browser end-to-end flow
        working-directory: fomothon
        run: npm run e2e -- artifacts/e2e

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fomothon-e2e-screenshots
          path: fomothon/artifacts/e2e/
          if-no-files-found: ignore
